# LearnChess nginx vhost — runs inside the Docker image, behind your
# reverse proxy (Caddy/Traefik/HAProxy) which terminates HTTPS.
#
# Cache-Control strategy (keyed off path):
#   - /index.html                 no-cache (the SPA shell mutates per deploy)
#   - /assets/**                  immutable 1y (Vite content-hashes filenames)
#   - /engine/*.wasm | *.nnue     30 days (vendored, not content-hashed but ~stable)
#   - /engine/*.json              1 day (manifest, can change between builds)
#   - /puzzles.db | /sqlite/*     30 days (vendored, sized: 55 MB / 850 KB)
#   - /board-themes/** /piece-sets/** /sounds/**   30 days
#   - /favicon.svg                1 day
#   - everything else             default (no Cache-Control, browser uses heuristic)
#
# Compression: brotli_static + gzip_static both on. The Dockerfile
# pre-compressed every text-like asset at build time, so nginx serves
# the .br / .gz variants directly without spending CPU per-request.

server {
    listen      8080 default_server;
    listen      [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ────────────────────────────────────────────────
    # Static (pre-compressed) variants take priority — zero per-request
    # CPU. Dynamic compression as fallback for anything we missed.
    brotli_static on;
    brotli on;
    brotli_comp_level 4;
    brotli_types
        application/javascript application/json application/wasm
        application/octet-stream application/xml
        text/css text/plain text/xml
        image/svg+xml font/woff2;

    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types
        application/javascript application/json application/wasm
        application/octet-stream application/xml
        text/css text/plain text/xml
        image/svg+xml font/woff2;
    gzip_min_length 256;

    # ── Disable absolute-path redirects ────────────────────────────
    # Some reverse proxies don't pass Host headers identically; relative
    # redirects keep things working when this image lives behind a path-
    # rewriting proxy.
    absolute_redirect off;

    # ── Security-ish headers ──────────────────────────────────────
    # Stockfish runs single-threaded so we don't need COOP/COEP. CSP
    # would be nice but the wasm engine + sqlite-wasm need
    # 'unsafe-eval' and 'unsafe-inline' — leaving CSP off for now.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # NOTE: HSTS belongs on the reverse proxy that terminates HTTPS,
    # not here.

    # ── Hashed assets: immutable, year-long cache ─────────────────
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── Engine WASM + NNUE weights ────────────────────────────────
    # ~85 MB total but caches aggressively. 30-day TTL.
    location /engine/ {
        location ~* \.(wasm|nnue)$ {
            add_header Cache-Control "public, max-age=2592000" always;
            try_files $uri =404;
        }
        location ~* \.json$ {
            add_header Cache-Control "public, max-age=86400" always;
            try_files $uri =404;
        }
        try_files $uri =404;
    }

    # ── Big static blobs ──────────────────────────────────────────
    location ~* ^/(puzzles\.db|opening-names\.json)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }
    location /sqlite/        { add_header Cache-Control "public, max-age=2592000" always; try_files $uri =404; }
    location /board-themes/  { add_header Cache-Control "public, max-age=2592000" always; try_files $uri =404; }
    location /piece-sets/    { add_header Cache-Control "public, max-age=2592000" always; try_files $uri =404; }
    location /sounds/        { add_header Cache-Control "public, max-age=2592000" always; try_files $uri =404; }

    # ── Favicon ───────────────────────────────────────────────────
    location = /favicon.svg {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # ── SPA shell: never cache ────────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    # ── SPA fallback ──────────────────────────────────────────────
    # Any path that doesn't match a real file falls through to
    # index.html so client-side routing handles deep links.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # ── Drop noise ────────────────────────────────────────────────
    location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }
    location ~ /\. { deny all; access_log off; log_not_found off; }
}
