<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0d10" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="LearnChess — practise tactics, openings and endgames offline. Local-first chess training with Stockfish, spaced repetition and Lichess-graded puzzles."
    />
    <link rel="icon" type="image/svg+xml" href="/brand/learnchess.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/learnchess-32.png" />
    <link rel="icon" href="/brand/learnchess.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/brand/learnchess-128.png" />

    <!-- Fonts (Instrumenta brand v2): Commissioner for the interface,
         Fraunces for display titles, Spline Sans Mono for FEN / PGN / code.
         Vendored in /fonts/brand (see docs/brand/README.md), never from a CDN:
         the app is offline-first, and inside Instrumenta it runs under a CSP
         with default-src 'none'. -->
    <link rel="stylesheet" href="/fonts/brand/fonts.css" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/brand/commissioner-oblique-latin.woff2"
      crossorigin
    />
    <!-- Brand icon motion (the rook hops on hover/focus; honours
         prefers-reduced-motion). -->
    <link rel="stylesheet" href="/brand/instrumenta-icons.css" />
    <script src="/brand/instrumenta-icons.js"></script>

    <title>LearnChess — Train tactics, openings & endgames offline</title>

    <!-- Zero-FOUC theme bootstrap. Reads the persisted choice (or the OS
         preference if no choice yet) and flips the .dark class BEFORE the
         first paint, so the body's `bg-background` is correct from frame 1.

         A separate file rather than an inline script, and not deferred: a
         classic <script src> in <head> still blocks parsing, so it runs
         before the first paint just as an inline one did, and it keeps
         script-src at 'self' under Instrumenta's CSP. -->
    <script src="/theme-bootstrap.js"></script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
