<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0d10" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="LearnChess — practise tactics, openings and endgames offline. Local-first chess training with Stockfish, spaced repetition and Lichess-graded puzzles."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts: Fraunces (variable display serif — warm, sharp, chess-study
         character) + Inter (body, neutral geometric sans) + JetBrains Mono
         (monospace for FEN/PGN/move counters). Pre-connect for the
         handshake; display=swap so the system fallback renders immediately
         and we don't FOIT. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />

    <title>LearnChess — Train tactics, openings & endgames offline</title>

    <!-- Zero-FOUC theme bootstrap. Reads the persisted choice (or the OS
         preference if no choice yet) and flips the .dark class BEFORE the
         first paint, so the body's `bg-background` is correct from frame 1.
         Inline because it must run synchronously, before main.tsx executes. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('learnchess.theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || (!stored && prefersDark);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage unavailable — fall back to OS preference only. */
        }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
