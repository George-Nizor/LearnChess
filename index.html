<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0d10" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="LearnChess — practise tactics, openings and endgames offline. Local-first chess training with Stockfish, spaced repetition and Lichess-graded puzzles."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts: Fraunces (variable serif) for BOTH display and body —
         user explicitly asked for the heading font to extend across
         the body too rather than mixing serif headers with sans body.
         JetBrains Mono is the monospace for FEN / PGN / move counters.

         Served from /fonts rather than fonts.googleapis.com. The app is
         offline-first, and inside Instrumenta it runs under a CSP with
         default-src 'none', where a third-party stylesheet and font host
         are both blocked. Regenerate with `npm run vendor:fonts`. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/fraunces-400-latin.woff2"
      crossorigin
    />

    <title>LearnChess — Train tactics, openings & endgames offline</title>

    <!-- Zero-FOUC theme bootstrap. Reads the persisted choice (or the OS
         preference if no choice yet) and flips the .dark class BEFORE the
         first paint, so the body's `bg-background` is correct from frame 1.

         A separate file rather than an inline script, and not deferred: a
         classic <script src> in <head> still blocks parsing, so it runs
         before the first paint just as an inline one did, and it keeps
         script-src at 'self' under Instrumenta's CSP. -->
    <script src="/theme-bootstrap.js"></script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
