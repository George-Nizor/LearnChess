<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    LearnChess favicon — a literal black king silhouette in the standard
    Cburnett style. The user has now twice rejected the sage / accent-tile
    variations: "just a standard chess piece like the king or rook".
    So this is exactly that — a king, recognisable at any browser favicon
    size, no decoration. Sits on a transparent background; both light and
    dark browser chromes look fine.

    The path is hand-distilled from the standard king glyph: cross, bulb,
    body, plinth — all one fill so the silhouette stays connected at 16px.
  -->
  <g fill="#1a1a1a" stroke="#1a1a1a" stroke-linejoin="round" stroke-linecap="round">
    <!-- Cross at the top -->
    <rect x="30" y="6"  width="4"  height="14" rx="0.5" />
    <rect x="25" y="11" width="14" height="4"  rx="0.5" />

    <!-- Bulb / orb beneath the cross -->
    <circle cx="32" cy="22" r="5" />

    <!-- King body: trapezoid widening to plinth -->
    <path d="
      M 22 28
      C 22 26 24 25 26 25
      L 38 25
      C 40 25 42 26 42 28
      L 44 44
      L 20 44
      Z" />

    <!-- Belt / decoration band — a thin negative space cut into the body -->
    <rect x="22" y="36" width="20" height="2" fill="#f8f6ee" stroke="none" />

    <!-- Plinth — wide base bar -->
    <rect x="14" y="44" width="36" height="6" rx="1" />
    <rect x="12" y="50" width="40" height="4" rx="1.5" />
  </g>
</svg>
